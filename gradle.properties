# Skopos build memory/worker policy. Chosen for a 16 GiB Linux host (see
# docs/DEVELOPMENT.md): the build is memory-bound rather than core-bound, so the
# daemon heap, the Kotlin daemon and the worker count are all kept deliberately
# modest and the desktop/editors keep their headroom. Reliability over speed.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=true

# Configuration cache is left off rather than forced: AGP 9 + Compose still run
# into cold spots, and the memory saved is not needed at this build size.
org.gradle.configuration-cache=false

android.useAndroidX=true